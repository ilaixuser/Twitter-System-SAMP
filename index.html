<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMP Twitter Smartphone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Kanit', sans-serif;
            background: transparent !important;
            display: flex; justify-content: flex-end; align-items: center;
            height: 100vh; margin: 0; padding-right: 50px; overflow: hidden;
        }

        /* ===== Notification ===== */
        #notification-area {
            position: fixed; top: 20px; left: 20px; z-index: 999999;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: none; width: 320px;
            will-change: transform;
        }
        .notification-toast {
            width: 100%; background: rgba(30,30,30,0.97);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; padding: 12px 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 0;
            pointer-events: auto; cursor: pointer; border-left: 4px solid #1d9bf0;
            animation: slideInLeft 0.5s cubic-bezier(0.34,1.56,0.64,1);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
            will-change: transform, opacity;
        }
        .notification-toast.hiding { opacity: 0; transform: translateX(-40px) scale(0.95); }
        .notif-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
        @keyframes slideInLeft {
            from { transform: translateX(-110%) scale(0.9) translateZ(0); opacity: 0; }
            to   { transform: translateX(0) scale(1) translateZ(0); opacity: 1; }
        }
        .notif-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid #1d9bf0; background: #111; }
        .notif-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .notif-body { flex: 1; overflow: hidden; min-width: 0; }
        .notif-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notif-text { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notif-preview-image { width: 100%; margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1px solid #333; max-height: 140px; }
        .notif-preview-image img { width: 100%; height: 140px; object-fit: cover; display: block; }

        /* ===== Phone ===== */
        .phone-wrapper {
            transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
            transform: translateY(110%) scale(0.9) translateZ(0); opacity: 0; pointer-events: none;
            will-change: transform, opacity;
        }
        .phone-wrapper.show { transform: translateY(0) scale(1) translateZ(0); opacity: 1; pointer-events: auto; }

        .phone-case {
            width: 320px; height: 650px;
            background: linear-gradient(145deg, #1c1c1e, #0a0a0a);
            border-radius: 52px; padding: 10px;
            box-shadow:
                0 50px 120px -20px rgba(0,0,0,0.9),
                0 0 0 1px rgba(255,255,255,0.08),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.5);
            position: relative;
        }
        /* Side buttons */
        .phone-case::before {
            content: ''; position: absolute; right: -4px; top: 120px;
            width: 4px; height: 60px; background: linear-gradient(180deg, #2a2a2c, #1c1c1e);
            border-radius: 0 3px 3px 0; box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
        }
        .phone-case::after {
            content: ''; position: absolute; left: -4px; top: 100px;
            width: 4px; height: 36px; background: linear-gradient(180deg, #2a2a2c, #1c1c1e);
            border-radius: 3px 0 0 3px;
        }

        .phone-screen {
            width: 100%; height: 100%;
            background: #000; border-radius: 43px;
            overflow: hidden; display: flex; flex-direction: column;
            position: relative;
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 30px;
            background: #000; border-radius: 20px; z-index: 200;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .di-camera { width: 10px; height: 10px; border-radius: 50%; background: #1a1a1a; border: 1.5px solid #2a2a2a; }
        .di-dot { width: 6px; height: 6px; border-radius: 50%; background: #0a4f0a; }

        /* Status Bar */
        .status-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 48px; z-index: 150; display: flex;
            align-items: flex-end; justify-content: space-between;
            padding: 0 22px 6px; pointer-events: none;
        }
        .status-time {
            font-size: 14px; font-weight: 700; color: white;
            font-variant-numeric: tabular-nums; letter-spacing: -0.3px;
        }
        .status-icons { display: flex; align-items: center; gap: 5px; }
        .status-signal { display: flex; align-items: flex-end; gap: 2px; }
        .signal-bar { width: 3px; background: white; border-radius: 2px; }
        .signal-bar:nth-child(1) { height: 5px; }
        .signal-bar:nth-child(2) { height: 8px; }
        .signal-bar:nth-child(3) { height: 11px; }
        .signal-bar:nth-child(4) { height: 14px; }
        .status-wifi { color: white; font-size: 12px; }
        .battery-wrap { display: flex; align-items: center; gap: 2px; }
        .battery-body {
            width: 22px; height: 11px; border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: 3px; position: relative; display: flex; align-items: center; padding: 1.5px;
        }
        .battery-body::after {
            content: ''; position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
            width: 2px; height: 5px; background: rgba(255,255,255,0.7); border-radius: 0 1px 1px 0;
        }
        .battery-fill { height: 100%; background: white; border-radius: 1.5px; transition: width 0.3s; }

        /* Home Bar */
        .home-bar-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30px;
            display: flex; justify-content: center; align-items: center;
            z-index: 500; cursor: pointer;
        }
        .home-bar { width: 100px; height: 4px; background: rgba(255,255,255,0.8); border-radius: 10px; transition: transform 0.2s; }
        .home-bar-container:active .home-bar { transform: scaleY(1.5) scaleX(0.9); }

        /* ===== Lock Screen ===== */
        #lock-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 300;
            background: linear-gradient(160deg, #0d1b2a 0%, #1a0533 40%, #0d1b2a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 60px 20px 40px;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            will-change: transform, opacity;
        }
        #lock-screen::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(120,80,255,0.35) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(0,180,255,0.3) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255,100,150,0.2) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 30% 80%, rgba(0,255,180,0.15) 0%, transparent 50%);
            animation: wallpaperShift 8s ease-in-out infinite alternate;
        }
        @keyframes wallpaperShift {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }
        .lock-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .lock-date { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 400; }
        .lock-time { font-size: 68px; font-weight: 200; color: white; letter-spacing: -3px; line-height: 1; }
        .lock-swipe {
            position: relative; z-index: 1; font-size: 12px; color: rgba(255,255,255,0.6);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .lock-swipe i { font-size: 20px; animation: swipePulse 2s ease-in-out infinite; }
        @keyframes swipePulse {
            0%,100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }
        #lock-screen.unlocking { opacity: 0; transform: translateY(-100%) scale(1.05); pointer-events: none; }
        .lock-glass-orb {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); z-index: 1;
        }

        /* ===== Home Screen ===== */
        .home-screen {
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(120,80,255,0.4) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(0,180,255,0.35) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255,100,150,0.25) 0%, transparent 60%),
                linear-gradient(160deg, #0d1b2a 0%, #1a0533 40%, #0d1b2a 100%);
            display: flex; flex-direction: column; padding: 55px 20px 40px;
            animation: wallpaperShift 8s ease-in-out infinite alternate;
        }

        .icon-box {
            width: 55px; height: 55px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
            cursor: pointer;
        }
        .icon-box:active { transform: scale(0.85); opacity: 0.8; }

        /* ===== App Window ===== */
        .app-window {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #000010; display: none; flex-direction: column; z-index: 20;
            animation: appIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
            will-change: transform, opacity;
        }
        @keyframes appIn {
            from { transform: scale(0.9) translateY(40px) translateZ(0); opacity: 0; }
            to   { transform: scale(1) translateY(0) translateZ(0); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%) translateZ(0); opacity: 0; }
            to { transform: translateX(0) translateZ(0); opacity: 1; }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0) translateZ(0); opacity: 1; }
            to { transform: translateX(100%) translateZ(0); opacity: 0; }
        }

        /* ===== Twitter Dark Theme ===== */
        .twitter-header {
            padding-top: 50px; padding-bottom: 0;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #2f3336;
            position: sticky; top: 0; z-index: 10;
        }
        .twitter-tabs { display: flex; gap: 0; }
        .twitter-tab {
            flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; color: #71767b;
            border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .twitter-tab:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        .twitter-tab.active { color: #fff; border-bottom-color: #1d9bf0; }

        #post-list {
            flex: 1; overflow-y: auto; background: #000;
            overscroll-behavior-y: contain; /* Smooth out scroll bounce */
            -webkit-overflow-scrolling: touch; /* Extra smooth scroll for mobile/embedded views */
        }

        .tweet-item {
            border-bottom: 1px solid #2f3336; padding: 12px 16px; display: flex; gap: 12px;
            animation: fadeUp 0.4s cubic-bezier(0.34,1.56,0.64,1); transition: background 0.2s;
            will-change: transform, opacity;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px) translateZ(0); }
            to   { opacity: 1; transform: translateY(0) translateZ(0); }
        }
        .tweet-avatar { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #2f3336; cursor: pointer; transition: transform 0.2s; }
        .tweet-avatar:active { transform: scale(0.9); opacity: 0.8; }
        .tweet-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .tweet-name { font-weight: 700; font-size: 14px; color: #fff; cursor: pointer; transition: color 0.2s;}
        .tweet-name:active { color: #1d9bf0; }
        .tweet-handle { font-size: 12px; color: #71767b; }
        .tweet-body { font-size: 14px; color: #e7e9ea; line-height: 1.5; margin-top: 3px; word-break: break-word; }
        .tweet-image {
            display: block; width: 100%; max-height: 200px; cursor: pointer;
            object-fit: cover; border-radius: 14px;
            border: 1px solid #2f3336; margin-top: 10px;
            transition: transform 0.2s;
        }
        .tweet-image:active { transform: scale(0.98); }
        .tweet-actions { display: flex; gap: 16px; margin-top: 10px; }
        .tweet-action { display: flex; align-items: center; gap: 5px; color: #71767b; font-size: 12px; cursor: pointer; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); }
        .tweet-action:hover { color: #1d9bf0; }
        .tweet-action:active { transform: scale(0.7); }
        .tweet-action.like.liked i { color: #f91880; }
        .tweet-action.like.liked span { color: #f91880; }
        
        .tweet-action.retweet.rt-active i { color: #00ba7c; }
        .tweet-action.retweet.rt-active span { color: #00ba7c; }

        /* FAB */
        .fab {
            position: absolute; bottom: 48px; right: 18px;
            width: 52px; height: 52px; background: linear-gradient(135deg, #1d9bf0, #0d7fd9);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; box-shadow: 0 8px 24px rgba(29,155,240,0.45);
            cursor: pointer; z-index: 30; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
        }
        .fab:active { transform: scale(0.85); box-shadow: 0 4px 12px rgba(29,155,240,0.3); }

        /* General Button Active States */
        button { transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s; }
        button:active { transform: scale(0.9); opacity: 0.7; }

        /* Post Modal */
        #post-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100;
            display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #16181c; width: 100%; border-radius: 24px 24px 0 0;
            padding: 16px 16px 30px; animation: modalSlide 0.35s cubic-bezier(0.34,1.56,0.64,1);
            border-top: 1px solid #2f3336;
        }
        @keyframes modalSlide {
            from { transform: translateY(100%) translateZ(0); opacity: 0; }
            to   { transform: translateY(0) translateZ(0); opacity: 1; }
        }
        #tweet-msg {
            font-family: 'Kanit', sans-serif; background: transparent; color: #e7e9ea;
            width: 100%; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.5; caret-color: #1d9bf0;
        }
        #tweet-msg::placeholder { color: #536471; }
        .modal-char-count { font-size: 11px; color: #536471; text-align: right; }

        /* Settings Dark */
        #settings-app { background: #000; }
        .settings-header {
            padding-top: 50px; padding-bottom: 12px;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #2f3336;
            display: flex; align-items: center; gap: 12px; padding-left: 16px;
            position: sticky; top: 0; z-index: 10;
        }
        .settings-body { padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;}
        .settings-input-label { font-size: 11px; color: #71767b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .settings-input {
            font-family: 'Kanit', sans-serif; width: 100%; background: #16181c; color: #e7e9ea;
            border: 1px solid #2f3336; border-radius: 12px; padding: 10px 14px; font-size: 14px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .settings-input:focus { border-color: #1d9bf0; box-shadow: 0 0 0 1px #1d9bf0; }
        
        /* Image Viewer */
        #image-viewer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 500; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            animation: fadeIn 0.2s ease; cursor: pointer;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Scroll */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<div id="notification-area"></div>

<!-- Image Viewer Modal -->
<div id="image-viewer" onclick="closeImageViewer()">
    <img id="viewer-img" src="" style="max-width:95%; max-height:85%; object-fit:contain; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);">
    <div style="position:absolute; bottom: 30px; color: white; font-size: 12px; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">แตะเพื่อปิด</div>
</div>

<div id="phone-toggle-wrapper" class="phone-wrapper">
    <div class="phone-case">
        <div class="dynamic-island">
            <div class="di-dot"></div>
            <div class="di-camera"></div>
        </div>

        <div class="phone-screen">

            <!-- Status Bar -->
            <div class="status-bar" id="status-bar">
                <div class="status-time" id="status-time">9:41</div>
                <div class="status-icons">
                    <div class="status-signal">
                        <div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div>
                    </div>
                    <div class="status-wifi"><i class="fa-solid fa-wifi" style="font-size:12px;color:white"></i></div>
                    <div class="battery-wrap">
                        <div class="battery-body"><div class="battery-fill" id="battery-fill" style="width:75%"></div></div>
                    </div>
                </div>
            </div>

            <!-- Lock Screen -->
            <div id="lock-screen" onclick="unlockPhone()">
                <div class="lock-glass-orb" style="width:180px;height:180px;top:80px;left:-40px;opacity:0.4"></div>
                <div class="lock-glass-orb" style="width:120px;height:120px;bottom:120px;right:-20px;opacity:0.3"></div>
                <div class="lock-content">
                    <div class="lock-date" id="lock-date">Thursday, April 2</div>
                    <div class="lock-time" id="lock-time">9:41</div>
                </div>
                <div style="position:relative;z-index:1;width:100%;display:flex;flex-direction:column;gap:8px" id="lock-notifs"></div>
                <div class="lock-swipe">
                    <i class="fa-solid fa-chevron-up"></i>
                    <span>แตะเพื่อปลดล็อค</span>
                </div>
            </div>

            <!-- Home Screen -->
            <div id="home-screen" class="home-screen" style="display:none">
                <div class="grid grid-cols-4 gap-3 mt-2">
                    <div class="flex flex-col items-center gap-1.5" onclick="openApp('twitter')">
                        <div class="icon-box" style="background:linear-gradient(135deg,#1d9bf0,#0d6ea0)">
                            <i class="fa-brands fa-x-twitter" style="color:white"></i>
                        </div>
                        <span style="font-size:10px;color:rgba(255,255,255,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.8)">Twitter</span>
                    </div>
                    <div class="flex flex-col items-center gap-1.5" onclick="openApp('settings')">
                        <div class="icon-box" style="background:linear-gradient(135deg,#636366,#3a3a3c)">
                            <i class="fa-solid fa-gear" style="color:white"></i>
                        </div>
                        <span style="font-size:10px;color:rgba(255,255,255,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.8)">Settings</span>
                    </div>
                </div>
            </div>

            <!-- Twitter App -->
            <div id="twitter-app" class="app-window">
                <div class="twitter-header">
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px">
                        <button onclick="backToHome()" style="color:#71767b;background:none;border:none;cursor:pointer;padding:4px">
                            <i class="fa-solid fa-arrow-left" style="font-size:18px"></i>
                        </button>
                        <i class="fa-brands fa-x-twitter" style="color:white;font-size:22px"></i>
                        <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid #2f3336;cursor:pointer;background:#2f3336;transition:transform 0.2s" onclick="openApp('settings')" onmousedown="this.style.transform='scale(0.9)'" onmouseup="this.style.transform='scale(1)'">
                            <img id="my-avatar" src="https://img2.pic.in.th/profile.jpeg" style="width:100%;height:100%;object-fit:cover" onerror="this.src='https://img2.pic.in.th/profile.jpeg'">
                        </div>
                    </div>
                    <div class="twitter-tabs">
                        <div class="twitter-tab active" onclick="playSound('click')">สำหรับคุณ</div>
                        <div class="twitter-tab" onclick="playSound('click')">กำลังติดตาม</div>
                    </div>
                </div>

                <div id="post-list"></div>

                <div class="fab" onclick="openPostModal()">
                    <i class="fa-solid fa-feather"></i>
                </div>

                <!-- Post Modal -->
                <div id="post-modal" onclick="closePostModal()">
                    <div class="modal-content" onclick="event.stopPropagation()">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                            <button onclick="closePostModal()" style="color:#71767b;background:none;border:none;cursor:pointer;font-family:Kanit,sans-serif;font-size:14px">ยกเลิก</button>
                            <button onclick="sendTweet()" style="background:#1d9bf0;color:white;border:none;padding:7px 18px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:Kanit,sans-serif;">โพสต์</button>
                        </div>
                        <div style="display:flex;gap:10px;align-items:flex-start">
                            <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#2f3336">
                                <img id="modal-avatar" src="https://img2.pic.in.th/profile.jpeg" style="width:100%;height:100%;object-fit:cover">
                            </div>
                            <div style="flex:1">
                                <textarea id="tweet-msg" lang="th" inputmode="text" autocomplete="off" spellcheck="false"
                                    placeholder="มีอะไรเกิดขึ้นบ้าง?"
                                    rows="4" style="width:100%;background:transparent;color:#e7e9ea;border:none;outline:none;resize:none;font-size:15px;line-height:1.6;caret-color:#1d9bf0;font-family:Kanit,sans-serif"
                                    maxlength="280" oninput="updateCharCount()"></textarea>
                            </div>
                        </div>
                        <div style="border-top:1px solid #2f3336;padding-top:10px;margin-top:8px">
                            <div style="display:flex;align-items:center;gap:8px;padding:8px;background:#1e2227;border-radius:12px">
                                <i class="fa-solid fa-image" style="color:#1d9bf0;font-size:13px"></i>
                                <input id="tweet-img" type="text" placeholder="ลิงก์รูปภาพ (ถ้ามี)"
                                    style="background:transparent;color:#e7e9ea;border:none;outline:none;font-size:12px;width:100%;font-family:Kanit,sans-serif"
                                    onfocus="this.style.color='#fff'" onblur="this.style.color='#e7e9ea'">
                            </div>
                            <div class="modal-char-count" id="char-count">280</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile View App (ซ้อนอยู่บน Twitter App) -->
            <div id="profile-view" class="app-window" style="animation: slideInRight 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; background:#000; z-index: 25;">
                <div class="twitter-header" style="padding-bottom: 12px; display: flex; align-items: center; gap: 16px; padding-left: 16px;">
                     <!-- ปุ่มกดย้อนกลับไป Twitter Feed -->
                     <button onclick="goBackToTwitter()" style="background:none; border:none; color:white; cursor:pointer;"><i class="fa-solid fa-arrow-left" style="font-size:18px"></i></button>
                     <span style="color:white; font-weight:700; font-size:16px;" id="profile-view-name">Loading...</span>
                </div>
                <div style="overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch;">
                    <div style="background: linear-gradient(45deg, #1d9bf0, #0a4f0a); height: 110px; width: 100%;"></div>
                    <div style="padding: 0 16px;">
                         <img id="profile-view-avatar" src="" style="width: 76px; height: 76px; border-radius: 50%; border: 4px solid #000; margin-top: -38px; background: #2f3336; object-fit: cover;">
                         <div style="margin-top: 10px;">
                             <h2 id="profile-view-title" style="color: white; font-size: 19px; font-weight: 700; line-height: 1;">...</h2>
                             <p style="color: #71767b; font-size: 14px; margin-top: 2px;" id="profile-view-handle">@...</p>
                             <p id="profile-view-bio" style="color: #e7e9ea; font-size: 14px; margin-top: 12px; line-height: 1.4;"></p>
                             <div style="display:flex; gap:16px; margin-top:12px; font-size:13px;">
                                 <div style="color:#71767b"><span style="color:white; font-weight:700;">120</span> กำลังติดตาม</div>
                                 <div style="color:#71767b"><span style="color:white; font-weight:700;">1.5K</span> ผู้ติดตาม</div>
                             </div>
                         </div>
                    </div>
                    <div class="twitter-tabs" style="margin-top: 16px; border-bottom: 1px solid #2f3336;">
                        <div class="twitter-tab active" onclick="playSound('click')">โพสต์</div>
                        <div class="twitter-tab" onclick="playSound('click')">การตอบกลับ</div>
                    </div>
                </div>
            </div>

            <!-- Settings App -->
            <div id="settings-app" class="app-window">
                <div class="settings-header">
                    <!-- เปลี่ยนมาเรียกใช้ backFromSettings() เพื่อเช็คว่ามาจากแอปไหน -->
                    <button onclick="backFromSettings()" style="background:none;border:none;cursor:pointer;color:#1d9bf0;padding:4px">
                        <i class="fa-solid fa-arrow-left" style="font-size:18px"></i>
                    </button>
                    <span style="color:white;font-weight:700;font-size:16px">แก้ไขโปรไฟล์</span>
                </div>
                <div class="settings-body">
                    <div style="display:flex;justify-content:center;padding:12px 0">
                        <div style="position:relative">
                            <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid #1d9bf0;background:#2f3336">
                                <img id="settings-avatar-preview" src="https://img2.pic.in.th/profile.jpeg" style="width:100%;height:100%;object-fit:cover">
                            </div>
                            <div style="position:absolute;bottom:0;right:0;background:#1d9bf0;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #000">
                                <i class="fa-solid fa-camera" style="color:white;font-size:9px"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="settings-input-label">Nickname</div>
                        <input id="set-nickname" type="text" maxlength="24" placeholder="ชื่อเล่น" class="settings-input">
                    </div>
                    <div>
                        <div class="settings-input-label">Avatar URL</div>
                        <input id="set-avatar" type="text" placeholder="https://..." class="settings-input">
                    </div>
                    <div>
                        <div class="settings-input-label">ข้อมูลของคุณ (Bio)</div>
                        <textarea id="set-bio" maxlength="80" placeholder="เขียนบางอย่างเกี่ยวกับตัวคุณ..." class="settings-input" rows="2" style="resize:none;"></textarea>
                    </div>
                    <button onclick="saveSettings()" style="background:linear-gradient(135deg,#1d9bf0,#0d7fd9);color:white;border:none;width:100%;padding:14px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:Kanit,sans-serif;margin-top:8px;box-shadow:0 6px 20px rgba(29,155,240,0.35);">บันทึกข้อมูล</button>
                </div>
            </div>

            <!-- Home Bar -->
            <div class="home-bar-container" onclick="requestClose()">
                <div class="home-bar"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Sound System (Web Audio API) =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'pop') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'notif') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now); // A5
            osc.frequency.setValueAtTime(1108.73, now + 0.1); // C#6
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // ===== State =====
    let currentNickname = "Player";
    let currentSkin = 0;
    let currentAvatar = "https://img2.pic.in.th/profile.jpeg";
    let currentBio = "";
    let isPhoneShown = false;
    let loadingPhase = true;
    let isLocked = true;
    let previousApp = 'home'; // เพิ่มตัวแปรสำหรับจำแอปก่อนหน้า

    const DEFAULT_AVATAR = "https://img2.pic.in.th/profile.jpeg";

    // ===== Clock =====
    function updateClock() {
        const now = new Date();
        const h = now.getHours().toString().padStart(2,'0');
        const m = now.getMinutes().toString().padStart(2,'0');
        const timeStr = `${h}:${m}`;
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

        const t1 = document.getElementById('status-time');
        const t2 = document.getElementById('lock-time');
        const t3 = document.getElementById('lock-date');
        if (t1) t1.textContent = timeStr;
        if (t2) t2.textContent = timeStr;
        if (t3) t3.textContent = dateStr;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ===== Battery Sim =====
    let batteryLevel = 75;
    setInterval(() => {
        batteryLevel = Math.max(10, Math.min(100, batteryLevel - 0.5));
        const fill = document.getElementById('battery-fill');
        if (fill) fill.style.width = batteryLevel + '%';
    }, 60000);

    // ===== Time Ago Formatter =====
    function timeAgo(timestamp) {
        if (!timestamp) return "เมื่อกี้";
        const seconds = Math.floor((Date.now() / 1000) - timestamp);
        if (seconds < 60) return "เมื่อกี้";
        if (seconds < 3600) return Math.floor(seconds/60) + " นาที";
        if (seconds < 86400) return Math.floor(seconds/3600) + " ชม.";
        return Math.floor(seconds/86400) + " วัน";
    }

    // ===== Lock Screen =====
    function unlockPhone() {
        playSound('pop');
        const ls = document.getElementById('lock-screen');
        if (!ls) return;
        ls.classList.add('unlocking');
        isLocked = false;
        setTimeout(() => {
            ls.style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
        }, 400);
    }

    // ===== Helpers =====
    function isUrl(val) { return /^https?:\/\/.{4,}/i.test(String(val).trim()); }
    function safeStr(val) { return val == null ? "" : String(val).trim(); }
    function getAvatarUrl(ava, skin) { const s = safeStr(ava); return isUrl(s) ? s : DEFAULT_AVATAR; }
    function escHtml(str) { return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    // ===== Toggle UI =====
    function toggleUI(show) {
        const el = document.getElementById('phone-toggle-wrapper');
        isPhoneShown = !!show;
        
        if (isPhoneShown) {
            playSound('pop');
            // เปิดมือถือใหม่ บังคับให้เป็นหน้าล็อคเสมอ
            isLocked = true;

            // ล้างแจ้งเตือนเก่าทิ้งเพื่อไม่ให้รกตอนเปิดหน้าจอใหม่
            document.getElementById('notification-area').innerHTML = '';
            document.getElementById('lock-notifs').innerHTML = '';

            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('lock-screen').classList.remove('unlocking');
            document.getElementById('home-screen').style.display = 'none';
            document.querySelectorAll('.app-window').forEach(a => a.style.display = 'none');
        }
        
        el.classList.toggle('show', isPhoneShown);
    }

    // ===== Notification =====
    function showNotification(nick, msg, skin, ava, imgUrl) {
        if (loadingPhase) return;
        
        playSound('notif'); // เล่นเสียงแจ้งเตือน
        
        const area = document.getElementById('notification-area');
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        const finalAva = getAvatarUrl(ava, skin);
        const hasImg = isUrl(safeStr(imgUrl));
        const imgSection = hasImg ? `<div class="notif-preview-image"><img src="${escHtml(imgUrl)}" onerror="this.parentElement.style.display='none'" alt=""></div>` : '';
        toast.innerHTML = `
            <div class="notif-row">
                <div class="notif-avatar"><img src="${escHtml(finalAva)}" onerror="this.src='${DEFAULT_AVATAR}'" alt=""></div>
                <div class="notif-body">
                    <div class="notif-name">${escHtml(nick)}</div>
                    <div class="notif-text">${escHtml(msg)}</div>
                </div>
            </div>${imgSection}`;
        toast.onclick = () => { playSound('click'); hideToast(toast); if (!isPhoneShown) safeCefEmit('requestClosePhone'); };
        area.appendChild(toast);

        // ปรับเวลาโชว์การแจ้งเตือนจาก 6 วินาที เป็น 10 วินาที
        setTimeout(() => hideToast(toast), 10000);

        if (isLocked) {
            const ln = document.getElementById('lock-notifs');
            if (ln) {
                const n = document.createElement('div');
                n.style.cssText = 'background:rgba(255,255,255,0.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,0.15)';
                n.innerHTML = `<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${escHtml(finalAva)}" style="width:100%;height:100%;object-fit:cover"></div><div><div style="font-size:12px;font-weight:700;color:white">${escHtml(nick)}</div><div style="font-size:11px;color:rgba(255,255,255,0.7)">${escHtml(msg)}</div></div>`;
                ln.appendChild(n);
                if (ln.children.length > 3) ln.removeChild(ln.firstChild);
            }
        }
    }

    function hideToast(toast) {
        if (!toast || !toast.parentNode) return;
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 320);
    }

    // ===== CEF =====
    function safeCefEmit(event, ...args) {
        try {
            if (typeof cef !== 'undefined' && cef && typeof cef.emit === 'function') cef.emit(event, ...args);
        } catch(e) {}
    }

    // ===== Navigation =====
    function openApp(appName) {
        playSound('click');
        
        // เช็คว่าเปิดแอปอะไรค้างอยู่เพื่อจำค่าเวลาย้อนกลับ
        let activeApp = 'home';
        document.querySelectorAll('.app-window').forEach(a => {
            if (a.style.display === 'flex' && a.id !== 'profile-view') {
                activeApp = a.id.replace('-app', '');
            }
        });
        previousApp = activeApp;

        document.querySelectorAll('.app-window').forEach(a => {
            // ไม่ซ่อนแอป Twitter ถ้าเป้าหมายที่กำลังจะเปิดคือ profile-view (ให้มันซ้อนทับกัน)
            if(appName === 'profile-view' && a.id === 'twitter-app') return;
            a.style.display = 'none';
        });
        
        const target = document.getElementById(appName + '-app') || document.getElementById(appName);
        if (target) {
            target.style.display = 'flex';
            target.style.animation = 'appIn 0.35s cubic-bezier(0.34,1.56,0.64,1)';
        }
        
        if (appName === 'settings') {
            document.getElementById('set-nickname').value = currentNickname;
            document.getElementById('set-avatar').value = currentAvatar;
            document.getElementById('set-bio').value = currentBio;
            updateSettingsPreview();
        }
    }

    function backToHome() {
        playSound('click');
        document.querySelectorAll('.app-window').forEach(a => a.style.display = 'none');
    }

    // ฟังก์ชันย้อนกลับที่ฉลาดขึ้น เช็คก่อนว่ามาจากแอปไหน
    function backFromSettings() {
        playSound('click');
        if (previousApp === 'twitter') {
            openApp('twitter');
        } else {
            backToHome();
        }
    }

    function goBackToTwitter() {
        playSound('click');
        const profileView = document.getElementById('profile-view');
        // เล่นแอนิเมชันสไลด์ออกทางขวา
        profileView.style.animation = 'slideOutRight 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards';
        // รอให้แอนิเมชันเล่นจบ แล้วค่อยตั้งให้หายไป
        setTimeout(() => {
            profileView.style.display = 'none';
            profileView.style.animation = ''; // รีเซ็ตแอนิเมชันกลับ
        }, 350);
    }

    function closeAppWindow(id) {
        playSound('click');
        const el = document.getElementById(id);
        if(el) el.style.display = 'none';
    }

    function requestClose() { playSound('click'); safeCefEmit('requestClosePhone'); }

    function openPostModal() {
        playSound('click');
        document.getElementById('post-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('tweet-msg').focus(), 100);
    }

    function closePostModal() { playSound('click'); document.getElementById('post-modal').style.display = 'none'; }

    function updateCharCount() {
        const ta = document.getElementById('tweet-msg');
        const cc = document.getElementById('char-count');
        if (ta && cc) {
            const rem = 280 - ta.value.length;
            cc.textContent = rem;
            cc.style.color = rem < 20 ? '#f4212e' : '#536471';
        }
    }

    // ===== Image Viewer =====
    function viewImage(url) {
        event.stopPropagation();
        playSound('click');
        if(!isUrl(url)) return;
        const viewer = document.getElementById('image-viewer');
        const img = document.getElementById('viewer-img');
        img.src = url;
        viewer.style.display = 'flex';
    }

    function closeImageViewer() {
        playSound('click');
        document.getElementById('image-viewer').style.display = 'none';
    }

    // ===== Profile Actions =====
    function updateSettingsPreview() {
        const url = document.getElementById('set-avatar').value.trim();
        const el = document.getElementById('settings-avatar-preview');
        if (el) el.src = isUrl(url) ? url : DEFAULT_AVATAR;
    }

    function saveSettings() {
        playSound('click');
        const nick = document.getElementById('set-nickname').value.trim();
        const ava  = document.getElementById('set-avatar').value.trim();
        const bio  = document.getElementById('set-bio').value.trim();
        if (!nick) return;
        safeCefEmit('onPlayerSaveSettings', nick + '\x01' + ava + '\x01' + bio);
        
        // ถ้าเซฟแล้วให้กลับไปหน้าแอปที่เปิดมาล่าสุด
        if (previousApp === 'twitter') {
            openApp('twitter');
        } else {
            backToHome();
        }
    }

    function updateProfileUI() {
        const finalAvatar = getAvatarUrl(currentAvatar, currentSkin);
        ['my-avatar','modal-avatar','settings-avatar-preview'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.src = finalAvatar;
        });
    }

    function showProfileView(username) {
        event.stopPropagation();
        playSound('click');
        safeCefEmit('requestProfile', username);
    }

    // ===== Interaction (Like/RT) =====
    function toggleLike(el, id) {
        event.stopPropagation();
        playSound('click');
        let isLiked = el.classList.contains('liked');
        let span = el.querySelector('span');
        let count = parseInt(span.innerText) || 0;
        let icon = el.querySelector('i');
        
        if(isLiked) {
            el.classList.remove('liked');
            icon.classList.replace('fa-solid', 'fa-regular');
            count--;
            safeCefEmit('onTweetAction', id + '\x01like\x010');
        } else {
            el.classList.add('liked');
            icon.classList.replace('fa-regular', 'fa-solid');
            count++;
            safeCefEmit('onTweetAction', id + '\x01like\x011');
        }
        span.innerText = count < 0 ? 0 : count;
    }

    function toggleRt(el, id) {
        event.stopPropagation();
        playSound('click');
        let isRt = el.classList.contains('rt-active');
        let span = el.querySelector('span');
        let count = parseInt(span.innerText) || 0;
        
        if(isRt) {
            el.classList.remove('rt-active');
            count--;
            safeCefEmit('onTweetAction', id + '\x01rt\x010');
        } else {
            el.classList.add('rt-active');
            count++;
            safeCefEmit('onTweetAction', id + '\x01rt\x011');
        }
        span.innerText = count < 0 ? 0 : count;
    }

    // ===== Tweet Feed =====
    function addTweetToFeed(id, nick, skin, message, image, avatarUrl, ts, likes, rts, prepend) {
        const feed = document.getElementById('post-list');
        const finalAvatar = getAvatarUrl(avatarUrl, parseInt(skin)||0);
        const cleanNick = escHtml(safeStr(nick));
        const cleanMsg  = escHtml(safeStr(message));
        const handle    = '@' + cleanNick.toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9_]/g,'');
        const imgSrc    = safeStr(image);
        
        const imageTag = isUrl(imgSrc) ? `<img src="${escHtml(imgSrc)}" class="tweet-image" onclick="viewImage('${escHtml(imgSrc)}')" onerror="this.style.display='none'" loading="lazy">` : '';
        const timeStr = timeAgo(parseInt(ts));

        const html = `
            <div class="tweet-item" data-id="${id}">
                <div class="tweet-avatar" onclick="showProfileView('${cleanNick}')">
                    <img src="${escHtml(finalAvatar)}" onerror="this.src='${DEFAULT_AVATAR}'">
                </div>
                <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                        <span class="tweet-name" onclick="showProfileView('${cleanNick}')">${cleanNick}</span>
                        <span class="tweet-handle">${handle}</span>
                        <span style="color:#536471;font-size:12px">· ${timeStr}</span>
                    </div>
                    <p class="tweet-body">${cleanMsg}</p>
                    ${imageTag}
                    <div class="tweet-actions">
                        <div class="tweet-action" onclick="playSound('click')"><i class="fa-regular fa-comment"></i><span>0</span></div>
                        <div class="tweet-action retweet" onclick="toggleRt(this, ${id})"><i class="fa-solid fa-retweet"></i><span>${parseInt(rts)||0}</span></div>
                        <div class="tweet-action like" onclick="toggleLike(this, ${id})"><i class="fa-regular fa-heart"></i><span>${parseInt(likes)||0}</span></div>
                        <div class="tweet-action" onclick="playSound('click')"><i class="fa-solid fa-chart-simple"></i></div>
                    </div>
                </div>
            </div>`;

        if (prepend) {
            feed.insertAdjacentHTML('afterbegin', html);
            feed.scrollTop = 0;
        } else {
            feed.insertAdjacentHTML('beforeend', html);
        }
    }

    function sendTweet() {
        playSound('click');
        const msg = document.getElementById('tweet-msg').value.trim();
        const img = document.getElementById('tweet-img').value.trim();
        if (!msg) return;
        safeCefEmit('onPlayerTweet', msg + '\x01' + img);
        document.getElementById('tweet-msg').value = '';
        document.getElementById('tweet-img').value = '';
        document.getElementById('char-count').textContent = '280';
        closePostModal();
    }

    // ===== CEF Events =====
    function registerCefEvents() {
        if (typeof cef === 'undefined' || !cef || typeof cef.on !== 'function') {
            return setTimeout(registerCefEvents, 150);
        }
        cef.on('togglePhone', function(val) { toggleUI(val); });
        
        cef.on('setPlayerData', function(nick, skin, ava, bio) {
            currentNickname = safeStr(nick) || "Player";
            currentSkin = parseInt(skin) || 0;
            currentAvatar = safeStr(ava) || DEFAULT_AVATAR;
            currentBio = safeStr(bio) || "";
            updateProfileUI();
            
            const setNick = document.getElementById('set-nickname');
            const setAva  = document.getElementById('set-avatar');
            const setBio  = document.getElementById('set-bio');
            if (setNick) setNick.value = currentNickname;
            if (setAva)  setAva.value  = currentAvatar;
            if (setBio)  setBio.value  = currentBio;
            updateSettingsPreview();
        });

        cef.on('loadTweet', function(id, nick, skin, msg, img, ava, ts, likes, rts) {
            // **แก้ไข:** บังคับให้โหลดเข้าด้านบน (prepend=true) โพสต์ใหม่จะถูกดันขึ้นบนสุด
            addTweetToFeed(id, nick, skin, msg, img, ava, ts, likes, rts, true);
        });

        cef.on('tweetsLoaded', function() { loadingPhase = false; });

        cef.on('pushTweet', function(id, nick, skin, msg, img, ava, ts, likes, rts) {
            addTweetToFeed(id, nick, skin, msg, img, ava, ts, likes, rts, true);
            showNotification(safeStr(nick), safeStr(msg), parseInt(skin)||0, safeStr(ava), safeStr(img));
        });

        cef.on('showProfileData', function(nick, ava, bio) {
            const handle = '@' + nick.toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9_]/g,'');
            document.getElementById('profile-view-name').innerText = nick;
            document.getElementById('profile-view-title').innerText = nick;
            document.getElementById('profile-view-handle').innerText = handle;
            document.getElementById('profile-view-avatar').src = getAvatarUrl(ava, 0);
            document.getElementById('profile-view-bio').innerText = bio || "ผู้ใช้นี้ยังไม่มีข้อมูลส่วนตัว";
            
            const profileView = document.getElementById('profile-view');
            profileView.style.display = 'flex';
            profileView.style.animation = 'slideInRight 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards';
        });

        safeCefEmit('browserReady');
    }

    // ===== Init =====
    registerCefEvents();

    document.getElementById('set-avatar').addEventListener('input', updateSettingsPreview);
    
    // **แก้ไข:** ป้องกันปัญหาการพิมพ์ภาษาไทยในช่อง input/textarea
    document.querySelectorAll('input, textarea').forEach(el => {
        ['keydown', 'keyup', 'keypress'].forEach(evt => {
            el.addEventListener(evt, e => e.stopPropagation());
        });
    });

    window.addEventListener('keydown', e => { 
        // เช็คว่าเคอร์เซอร์อยู่ในช่องพิมพ์หรือไม่ เพื่อไม่ให้ปุ่ม P ไปรบกวนเวลาแชท/พิมพ์
        const isTyping = document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
        
        if (isTyping) {
            // หยุดการทำงานเพื่อไม่ให้ปุ่มที่พิมพ์หลุดรอดไปปิดเกมหรือทำให้พิมพ์ภาษาไทยเพี้ยน
            e.stopPropagation();
            if (e.key === "Escape") {
                document.activeElement.blur(); // ให้ปุ่ม Esc เอาโฟกัสการพิมพ์ออกก่อน
            }
            return;
        }

        // กดปุ่ม P (หรือ ย ในคีย์บอร์ดไทย) เพื่อเปิด/ปิดโทรศัพท์
        if (e.key.toLowerCase() === "p" || e.key === "ย") {
            if (isPhoneShown) {
                requestClose(); // ปิด
            } else {
                toggleUI(true); // เปิด
            }
        }

        // กดปุ่ม Esc เพื่อปิดเมื่อมือถือถูกเปิดอยู่
        if (e.key === "Escape" && isPhoneShown) {
            requestClose();
        } 
    });

    // Thai IME fix (ปรับแก้เสริมความลื่นไหลเวลากดแป้นพิมพ์ไทย)
    const tweetMsg = document.getElementById('tweet-msg');
    if (tweetMsg) {
        tweetMsg.addEventListener('compositionstart', () => { tweetMsg.dataset.composing = '1'; });
        tweetMsg.addEventListener('compositionend', () => { delete tweetMsg.dataset.composing; updateCharCount(); });
        tweetMsg.addEventListener('input', () => { if (!tweetMsg.dataset.composing) updateCharCount(); });
    }
</script>
</body>
